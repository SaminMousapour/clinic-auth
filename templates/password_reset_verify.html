{% extends 'base.html' %}

{% block title %}Verify Identity{% endblock %}

{% block content %}
<div class="page-container">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <h2>Verify Your Identity</h2>
    <p class="subtitle">For security, please confirm your username and age</p>

    <form method="post" class="login-form" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" autocomplete="username" id="username" name="username" required placeholder="Your username">
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" autocomplete="off" id="age" name="age" required placeholder="Your age" min="1" max="120">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Verify & Continue</button>
    </form>

    <div class="back-link">
        <a href="{% url 'password_reset_request' %}">Back</a>
    </div>
</div>
{% endblock %}

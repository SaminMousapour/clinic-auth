{% extends 'base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="page-container">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <h2>Set New Password</h2>
    <p class="subtitle">Your identity has been verified. Choose a new password.</p>

    <form method="post" class="login-form" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="password1">New Password</label>
            <input type="password" autocomplete="new-password" id="password1" name="password1" required placeholder="At least 8 characters, with letters and numbers">
        </div>
        <div class="form-group">
            <label for="password2">Confirm New Password</label>
            <input type="password" autocomplete="new-password" id="password2" name="password2" required placeholder="Repeat your new password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Reset Password</button>
    </form>

    <div class="back-link">
        <a href="{% url 'password_reset_verify' %}">Back</a>
    </div>
</div>
{% endblock %}

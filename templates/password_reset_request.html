{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="page-container">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <h2>Reset Password</h2>
    <p class="subtitle">Enter your phone number or email to begin</p>

    <form method="post" class="login-form" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="identifier">Phone Number or Email</label>
            <input type="text" autocomplete="off" id="identifier" name="identifier" required placeholder="e.g., 09123456789 or email@example.com">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Continue</button>
    </form>

    <div class="back-link">
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}
